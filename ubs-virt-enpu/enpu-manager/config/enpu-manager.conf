# ENPU Manager Configuration

# Server settings
rest_port=8080

# Paths
config_dir=/etc/enpu
state_dir=/var/lib/enpu-manager

# Logging
log_level=info
log_dir=/var/log/enpu-manager


# Allocation strategy: compact / anti-fragment
share-strategy=compact

# Per-die oversub ratio (CSV, by phy_id). 0 means swap disabled on that die.
#   oversub-ratio=0.2                  # 所有 die 均按 0.2 启用（兼容单值写法）
#   oversub-ratio=0.2,0.3              # phy0=0.2, phy1=0.3, 其他 die=0
#   oversub-ratio=0.2,0.2,0.0,0.3      # phy2 显式禁，phy3 启用 0.3
oversub-ratio=0.0,0.0,0.0,0.0

# Swap watermarks (percentage of die HBM usage)
swap-pre-watermark=80
